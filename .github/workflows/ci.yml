name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Unit and Integration Tests
        run: go test -count=1 ./...

      - name: Race Detection Tests
        run: go test -race -count=1 ./...
